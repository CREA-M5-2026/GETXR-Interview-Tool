<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code Review Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#f6f7f5; --surface:#ffffff; --sunk:#eef0ed; --fg:#1c2220; --muted:#5b6461; --line:#d8dcd6;
  --team:#cf6a14; --team-t:#fbe4cf;
  --solo:#2c8a66; --solo-t:#d3ede2;
  --master:#7449bd; --master-t:#e7ddf6;
  --clear:#2c8a66; --clear-t:#d3ede2;
  --unclear:#a86a09; --unclear-t:#f8e7c4;
  --doubt:#b4412f; --doubt-t:#f6dcd6;
  --accent:var(--team); --accent-t:var(--team-t);
  --sans:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#191919; --surface:#202322; --sunk:#262a29; --fg:#e7eae8; --muted:#9aa39f; --line:#343a38;
  --team:#ef9445; --team-t:#46301b; --solo:#52c095; --solo-t:#173a2d; --master:#a888e8; --master-t:#32274a;
  --clear:#52c095; --clear-t:#173a2d; --unclear:#e0a84a; --unclear-t:#45361a; --doubt:#ec8571; --doubt-t:#4a2620;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#191919; --surface:#202322; --sunk:#262a29; --fg:#e7eae8; --muted:#9aa39f; --line:#343a38;
  --team:#ef9445; --team-t:#46301b; --solo:#52c095; --solo-t:#173a2d; --master:#a888e8; --master-t:#32274a;
  --clear:#52c095; --clear-t:#173a2d; --unclear:#e0a84a; --unclear-t:#45361a; --doubt:#ec8571; --doubt-t:#4a2620;
  color-scheme:dark}
body[data-mode="bs"]{--accent:var(--solo);--accent-t:var(--solo-t)}
body[data-mode="m"],body[data-mode="mm"]{--accent:var(--master);--accent-t:var(--master-t)}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--muted);outline-offset:2px}
code{font-family:var(--mono);font-size:.86em;background:var(--sunk);padding:.05em .3em;border-radius:3px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}

/* top bar */
.bar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-row{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;padding:8px 0 6px}
.bar-row2{display:flex;align-items:center;gap:6px;padding:2px 0 6px}
.bar-row3{display:flex;align-items:center;gap:8px}
.bar-row3 .tabs{flex:1;min-width:0}
.modes{display:flex;gap:6px 14px;flex-wrap:wrap}
.mgroup{display:flex;align-items:center;gap:6px}
.mlab{font-size:12.5px;font-weight:600;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.modes button{border:0;background:transparent;padding:5px 9px;font-size:12.5px;font-weight:500;color:var(--muted);border-right:1px solid var(--line);white-space:nowrap}
.seg button:last-child{border-right:0}
.modes button[aria-pressed="true"]{color:var(--fg);background:var(--accent-t);box-shadow:inset 0 -2px 0 var(--accent)}
.clock{flex:none;display:flex;align-items:center;gap:8px;margin-right:6px}
.nextstu{margin-left:auto;flex:none}
.time{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em;line-height:1;min-width:4ch}
.time.warn{color:var(--unclear)} .time.over{color:var(--doubt)}
.phint{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.phint.move{color:var(--doubt);font-weight:600}
.btn{white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 11px;font-size:13px;font-weight:600}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.05);background:var(--accent)}
.btn.armed{background:var(--surface);border-color:var(--doubt);color:var(--doubt)}
.btn.small{padding:3px 8px;font-size:12px;font-weight:500}
.phases{flex:1;min-width:0;display:flex;gap:3px;overflow-x:auto;scrollbar-width:none}
.ph{border:0;font:inherit;cursor:pointer;text-align:left;flex:var(--w) 1 auto;min-width:max-content;height:24px;border-radius:3px;background:var(--sunk);position:relative;overflow:hidden;font-size:11.5px;color:var(--muted);display:flex;align-items:center;padding:0 6px;white-space:nowrap}
.ph i{position:absolute;left:0;bottom:0;height:3px;width:var(--p,0%);background:var(--accent)}
.ph span{position:relative}
.ph.now{color:var(--fg);font-weight:600;background:var(--accent-t)}
.ph.done{color:var(--fg)}
.ph.over i{background:var(--doubt)}
.ph.over{color:var(--doubt)}
.endrow{display:flex;justify-content:flex-end;margin-top:4px}
.pickfirst{border:1px dashed var(--accent);border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:14px;background:var(--accent-t)}
.modes.need .seg{box-shadow:0 0 0 2px var(--accent)}
.ph:hover{filter:brightness(.97)}
.btn:disabled,.chip:disabled{opacity:.4;cursor:default}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:transparent;padding:6px 9px 7px;font-size:13.5px;font-weight:500;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
.tabs{align-items:center}
.tabs .t-main{font-weight:700;color:var(--fg);font-size:14.5px;padding-right:12px}
.tabs .t-sep{width:1px;height:18px;background:var(--line);margin:0 8px 0 4px;flex:none}
.tabs .t-lab{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-right:2px;white-space:nowrap}
.helpbtn{flex:none;display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;padding:6px 2px 7px 10px;font-size:13.5px;font-weight:500;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent;line-height:1}
.helpbtn[aria-pressed="true"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
.helpbtn .qi{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;border:1.5px solid currentColor;font-size:10.5px;font-weight:700;line-height:1;box-sizing:border-box}
.pastehow{margin:10px 0 0;padding-left:20px;font-size:13.5px}
.pastehow li{margin:3px 0}

/* content */
main.wrap{padding-top:24px;padding-bottom:48px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:12px}
.step.now{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.step-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.step-h h2{font-size:16px;margin:0;font-weight:700}
.step-h .t{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.step-h .nowtag{font-size:12px;font-weight:600;color:var(--accent)}
.note{color:var(--muted);font-size:13.5px;margin:0 0 4px}
.checks{margin:0;padding-left:20px;font-size:14px}
.checks li{margin:4px 0}
.cyc-h{margin:12px 0 2px;font-size:13.5px;font-weight:600}
.cycle{margin:0;padding-left:22px;font-size:13.5px}
.cycle li{margin:3px 0}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.row .lab{font-size:12.5px;color:var(--muted);min-width:76px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:500}
.chip:hover{background:var(--sunk)}
.chip[aria-pressed="true"]{background:var(--accent-t);border-color:var(--accent);color:var(--fg)}
.chip.sugg{border-style:dashed;border-color:var(--accent)}
.chip.res-clear[aria-pressed="true"]{background:var(--clear-t);border-color:var(--clear)}
.chip.res-unclear[aria-pressed="true"]{background:var(--unclear-t);border-color:var(--unclear)}
.chip.res-doubt[aria-pressed="true"]{background:var(--doubt-t);border-color:var(--doubt)}
textarea.ta{font:inherit;font-size:14px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%;min-height:52px;resize:vertical;margin-top:4px}
.field{margin:10px 0}
.field label{display:block;font-size:13px;font-weight:600;color:var(--muted)}
.tick{display:flex;gap:6px;align-items:center;font-size:14px;margin:8px 0}
.tonotion{border:2px solid var(--accent);border-radius:8px;padding:14px 16px;margin-bottom:12px;background:var(--surface)}
.tonotion h2{margin:0 0 6px}
input[type=text]{font:inherit;font-size:14px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 8px;width:100%;max-width:280px}

/* the check card: the one bold element */
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:4px 8px 8px 4px;padding:12px 14px 12px 14px;margin:8px 0}
.card .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px;font-size:12px}
.tag{border-radius:3px;padding:1px 6px;font-weight:600;background:var(--sunk);color:var(--muted)}
.tag.move{background:var(--accent-t);color:var(--fg)}
.tag.given{background:var(--unclear-t);color:var(--fg)}
.tag.editor{background:var(--sunk);color:var(--fg)}
.deckname{color:var(--muted);font-size:12px;margin-left:auto}
.where{font-size:13.5px;color:var(--muted);margin:0 0 8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.where .wl{font-size:12px;color:var(--muted)}
.where b{color:var(--fg);font-family:var(--mono);font-size:13px;font-weight:700;background:var(--accent-t);border:1px solid var(--accent);border-radius:4px;padding:1px 7px}
.where span:last-child{color:var(--fg)}
.walk-steps{margin:0 0 10px;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.walk-steps li{line-height:1.45}
.walk-steps .ws{display:block;font-size:12px;color:var(--muted);margin-bottom:1px}
.walk-steps .q{font-weight:600}
.walk-steps small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.chg .then{font-size:13px;color:var(--muted);margin-right:4px}
.chg .q{font-weight:600}
.chg-hint{font-size:12.5px;color:var(--muted);margin:4px 0 0}
.about{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:6px;padding:7px 10px;margin:4px 0 10px}
.stall{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
@media (max-width:620px){.stall{grid-template-columns:repeat(2,1fr)}}
.chip.step2{width:100%;display:inline-flex;flex-direction:column;align-items:flex-start;border-radius:8px;padding:4px 10px;line-height:1.2;text-align:left}
.chip.step2 small{font-size:11.5px;font-weight:400;opacity:.85}
.say{font-size:17px;font-weight:600;line-height:1.35;margin:0 0 8px;text-wrap:pretty}
.say::before{content:"Ask \201C";color:var(--muted);font-weight:500}
.say::after{content:"\201D";color:var(--muted)}
.chg{margin:0;font-size:14.5px;line-height:1.5}
.chg b{font-weight:600}
.exp{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
.exp button{border:0;background:none;padding:0;font-size:13px;font-weight:600;color:var(--accent)}
.exp p{margin:6px 0 0;font-size:14px;background:var(--sunk);border-radius:6px;padding:8px 10px}
.card-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.empty{border:1px dashed var(--line);border-radius:8px;padding:12px 14px;color:var(--muted);font-size:14px;margin:8px 0}
.verdict{border-radius:8px;padding:12px 14px;margin-bottom:12px;border:1px solid var(--line);background:var(--surface)}
.verdict h2{margin:0 0 6px;font-size:17px}
.verdict.pass{background:var(--clear-t);border-color:var(--clear)}
.verdict.third{background:var(--unclear-t);border-color:var(--unclear)}
.verdict.doubt{background:var(--doubt-t);border-color:var(--doubt)}
.quote{font-size:15.5px;font-weight:600;margin:10px 0;padding-left:10px;border-left:3px solid var(--accent)}
.copy{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.copy output{font-family:var(--mono);font-size:12px;background:var(--sunk);border-radius:4px;padding:3px 7px;color:var(--muted);overflow-wrap:anywhere}
.hint{font-size:13px;color:var(--muted);margin:8px 0 0}
.ai{font-size:13.5px;margin:8px 0 0;padding:10px 12px;border-radius:6px;background:var(--sunk)}
.ai p{margin:0 0 7px}
.ai p:last-child{margin-bottom:0}
.ai b{font-weight:600}
.notes{font-family:var(--mono);font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin:6px 0 0;white-space:pre-wrap;color:var(--fg)}
.typ{display:block;margin-top:4px;font-size:12.5px;color:var(--muted)}
.tips{margin:4px 0 6px;padding:8px 10px 8px 28px;background:var(--sunk);border-radius:6px;font-size:14px}
.tips li{margin:5px 0}

/* deck tabs */
.deck-h{margin:0 0 4px;font-size:18px}
.deck-sub{color:var(--muted);font-size:13.5px;margin:0 0 12px}
.legend{display:flex;flex-wrap:wrap;gap:8px;font-size:12.5px;color:var(--muted);margin-bottom:10px}

/* guide */
.guide h2{font-size:16px;margin:20px 0 6px}
.guide h2:first-child{margin-top:0}
.guide table{border-collapse:collapse;width:100%;font-size:14px}
.guide th,.guide td{text-align:left;vertical-align:top;padding:6px 8px;border-bottom:1px solid var(--line)}
.guide th{font-size:12.5px;color:var(--muted);font-weight:600}
.guide ol,.guide ul{margin:0;padding-left:20px;font-size:14px}
.guide li{margin:5px 0}
.guide p{margin:10px 0;font-size:14px}
@media (max-width:520px){.time{font-size:20px}.say{font-size:16px}.row .lab{min-width:0;width:100%}}
@media (prefers-reduced-motion:no-preference){.step.now{transition:box-shadow .2s}}
</style>
</head>
<body data-mode="bt">
<div class="bar">
  <div class="wrap">
    <div class="bar-row">
      <div class="modes" role="group" aria-label="Student type" id="modes"></div>
      <button class="btn nextstu" data-act="next">Clear</button>
    </div>
    <div class="bar-row2">
      <div class="clock">
        <span class="time" id="time" aria-live="off">0:00</span>
        <button class="btn primary" id="startBtn" data-act="timer">Start</button>
      </div>
      <div class="phases" id="phases"></div>
    </div>
    <div class="bar-row3">
      <nav class="tabs" role="tablist" id="tabs"></nav>
      <button class="helpbtn" id="helpBtn" data-act="tab" data-v="guide"><span class="qi" aria-hidden="true">?</span>How it works</button>
    </div>
  </div>
</div>
<main class="wrap" id="main"></main>

<script src="decks.js"></script>
<script>
(function(){
"use strict";
const D = window.DECKS;

/* ---------- safe storage (rotation memory only; no student data) ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

/* ---------- config ---------- */
const MODES = {
  bt: { group:"Bachelor", label:"In an IMDEV team", tip:"Notion row shows a DEV team. Final Project is a sub-system of the IMDEV game.", short:"Bachelor, team", p1:"A", p2:"A", only:"team", status:true },
  bs: { group:"Bachelor", label:"Solo XR demo", tip:"Notion row shows Solo. Final Project is a stand-alone XR demo.", short:"Bachelor, solo", p1:"A", p2:"A", only:"solo", status:true },
  m:  { group:"Master", label:"Standard", tip:"Foundation assignments A1–A6 plus the XR Development Project.",           short:"Master",         p1:"A", p2:"A",  status:false },
  mm: { group:"Master", label:"Mentorship Path", tip:"Tutorial package instead of A1–A6, plus the XR Development Project.",       short:"Master, Mentorship Path", p1:"TUTORIAL", p2:"TUTORIAL", status:false }
};
const ADECKS = ["A1","A2","A3","A4","A5","A6"];
const WEIGHTS = {A1:1, A2:1, A3:1.5, A4:2, A5:2, A6:2};
const STEPS = ["Locate","Explain","Predict","Change","Reconcile"];
const STALL = {Locate:"couldn't find the code", Explain:"read aloud or stayed vague", Predict:"no clear prediction", Change:"needed help typing it", Reconcile:"couldn't explain the result"};
const MOVES = {tweak:"Tweak", remove:"Remove", move:"Move it", extend:"Extend", trace:"Trace", "why-not":"Why not"};
const SOURCES = {own:"Own code", given:"Given in brief/template"};
function needsThird(){ return verdict().k==="third" || !!S.probes[2].deck || !!S.probes[2].result; }
function phasesFor(mode){
  const third = needsThird(), st = MODES[mode].status;
  const list = [{id:"setup",n:"Setup",len:1},{id:"p1",n:"Check 1",len:5},{id:"p2",n:"Check 2",len:6}];
  if(third) list.push({id:"p3",n:"Check 3",len:3});
  if(st) list.push({id:"checkin",n:"Check-in",len:third?2:5});
  let e = 0; list.forEach(p => { e += p.len; p.e = e; });
  return list;
}

/* ---------- state ---------- */
const blankProbe = () => ({deck:null, card:null, reveal:false, result:null, fails:[], ai:null, script:""});
let S, scrollTarget = null;
function scrollToPhase(id){
  const el = document.querySelector(`#main [data-phase="${id}"]`); if(!el) return;
  const top = el.getBoundingClientRect().top + window.scrollY - document.querySelector(".bar").offsetHeight - 12;
  window.scrollTo({top: Math.max(0, top), behavior: "smooth"});
}
function reset(keepMode){
  const mode = keepMode && S ? S.mode : (store.get("crg-mode","bt"));
  S = { mode, tab:"flow", aiPath:null, sugg:null,
        timer:{running:false, start:0, acc:0}, phase:"setup", phaseAt:0,
        probes:[blankProbe(), blankProbe(), blankProbe()],
        advice:null, armedNext:false, modeChosen:false,
        outcome:null, saw:"", ci1:"", ci2:"", unprepared:false, copied:false };
}
const live = {
  load(){ try{ const v = sessionStorage.getItem("crg-live"); return v ? JSON.parse(v) : null; }catch(e){ return null; } },
  save(){ try{ sessionStorage.setItem("crg-live", JSON.stringify(S)); }catch(e){} },
  clear(){ try{ sessionStorage.removeItem("crg-live"); }catch(e){} }
};
reset(false);
{ const saved = live.load();
  if(saved && saved.probes && saved.timer && MODES[saved.mode]) S = Object.assign(S, saved, {armedNext:false}); }

/* ---------- dealing with rotation ---------- */
function cardsFor(deckKey){
  const only = MODES[S.mode].only;
  return D[deckKey].cards.filter(c => !c.only || c.only === only);
}
function deal(deckKey, avoidId){
  const used = store.get("crg-used", {});
  let pool = cardsFor(deckKey).filter(c => c.id !== avoidId);
  if(!pool.length) pool = cardsFor(deckKey);
  const min = Math.min(...pool.map(c => used[c.id]||0));
  const least = pool.filter(c => (used[c.id]||0) === min);
  const pick = least[Math.floor(Math.random()*least.length)];
  used[pick.id] = (used[pick.id]||0) + 1;
  store.set("crg-used", used);
  return pick;
}
function suggestA(){
  const exclude = S.probes.map(p=>p.deck);
  const opts = ADECKS.filter(k => !exclude.includes(k));
  const tot = opts.reduce((s,k)=>s+WEIGHTS[k],0);
  let r = Math.random()*tot;
  for(const k of opts){ r -= WEIGHTS[k]; if(r<=0) return k; }
  return opts[opts.length-1];
}
function findCard(id){
  for(const k in D){ const c = D[k].cards.find(x=>x.id===id); if(c) return {deck:k, card:c}; }
  return null;
}

/* ---------- verdict ---------- */
function verdict(){
  const [a,b,c] = S.probes;
  if(S.probes.some(p => p.ai === "no"))
    return {k:"doubt", h:"Doubt", t:"Their account doesn't fit the declared AI path. Write down what they said under “What I saw”. Maro follows up."};
  if(!a.result || !b.result)
    return {k:"pending", h:"No outcome yet", t:"Mark check 1 and check 2 as clear or unclear."};
  const weak = p => p.result==="unclear" || p.ai==="unsure";
  const unclear = [a,b].filter(weak).length;
  if(unclear === 0) return {k:"pass", h:"Pass", t:"Two clear checks."};
  if(unclear === 2) return {k:"doubt", h:"Doubt", t:"Both checks were unclear or uncertain. Write down where they got stuck under “What I saw”. Maro follows up."};
  if(!c.result) return {k:"third", h:"Do a third check", t:"One check was unclear, or you weren't sure how the code came about. Pick a different file, ideally from another assignment."};
  return !weak(c)
    ? {k:"pass", h:"Pass", t:"The third check was clear."}
    : {k:"doubt", h:"Doubt", t:"Still unclear after the third check. Write down where they got stuck under “What I saw”. Maro follows up."};
}

/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const rich = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
function fmt(ms){ const s = Math.max(0,Math.floor(ms/1000)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
function elapsed(){ return S.timer.acc + (S.timer.running ? Date.now()-S.timer.start : 0); }
function deckLabel(k){ return k && k.startsWith("A") ? k : (k==="PROJECT"?"Project":k==="MASTER"?"Master project":k==="TUTORIAL"?"Tutorial":k); }
function visibleTabs(){

function renderClock(){
  const ph = phasesFor(S.mode), total = ph[ph.length-1].e*60000, el = elapsed();
  let idx = ph.findIndex(p => p.id === S.phase);
  if(idx < 0){ idx = ph.length-1; S.phase = ph[idx].id; }
  const t = document.getElementById("time");
  t.textContent = fmt(el);
  t.classList.toggle("over", el > total);
  t.classList.toggle("warn", el <= total && el > total-60000);
  document.getElementById("startBtn").textContent = S.timer.running ? "Pause" : (el>0 ? "Resume" : "Start");

  const inPhase = el - S.phaseAt;
  document.getElementById("phases").innerHTML = ph.map((p,i) => {
    const len = p.len*60000, now = i===idx, done = i<idx;
    const pct = done ? 100 : now ? Math.min(100, inPhase/len*100) : 0;
    const over = now && inPhase > len;
    const left = len - inPhase;
    const lab = now && el>0 ? (left>0 ? `${p.n} (${fmt(left+999)} left)` : `${p.n}: move on`) : `${p.n} (${p.len} min)`;
    return `<button class="ph${now?" now":""}${done?" done":""}${over?" over":""}" data-act="phase" data-v="${p.id}" style="--w:${p.len};--p:${pct}%" aria-pressed="${now}"><i></i><span>${lab}</span></button>`;
  }).join("");
  document.querySelectorAll(".step[data-phase]").forEach(n => {
    const on = n.dataset.phase === S.phase && el > 0;
    n.classList.toggle("now", on);
    const tag = n.querySelector(".nowtag"); if(tag) tag.hidden = !on;
  });
}

function whereFile(w){ const m = (w||"").split(" · ")[0].match(/[\w.]+\.cs\b/); return m ? m[0] : ""; }
function whereHTML(w){

  return /\.cs\b/.test(a) ? `<b>${esc(a)}</b>${b?`<span>${rich(b)}</span>`:""}` : `<span>${rich(w)}</span>`;

function cardHTML(deckKey, c, opts){

    ${c.source==="given"?`<p class="hint">This came with the brief or template, so focus on the prediction and the change.</p>`:""}

function copyText(i){
  const p = S.probes[i];

  if(p.script.trim()) parts.push("note: "+p.script.trim());
  return parts.join(" · ");
}

  <tr><td>Predicts with a reason, or self-corrects</td><td>Can't predict, can't explain a wrong result</td></tr>
  <tr><td>Types the change without help</td><td>Needs syntax dictated for a two-line change</td></tr>
  <tr><td>Knows its history (“this broke when…”)</td><td>No memory of writing or debugging it</td></tr>
  <tr><td>Their story of how it was written fits their AI path</td><td>Their story doesn't fit their AI path</td></tr>
  </tbody></table>
  <p><b>Not signals:</b> bugs, messy code, nerves, forgetting an API name, looking something up in the Unity docs. Authorship is the question, not quality.</p>

  <h2>Decision rule</h2>
  <ul>
  <li>Two clear checks: <b>Pass</b>.</li>
  <li>One unclear: a third check on a different file. Clear: Pass. Still unclear: <b>Doubt</b>.</li>
  <li>Their account doesn't fit the declared AI path: <b>Doubt</b>.</li>
  <li>Doubt isn't a fail. It means: write down what you saw in the guide's “What I saw” box, so Maro has something concrete to follow up on. TAs never mark Fail.</li>
  <li>Couldn't run the check properly (no code to look at, slot cut short): <b>Needs Maro</b>.</li>
  <li>Don't argue it out or hint that something is wrong. Move on to the next check.</li>
  </ul>

  <h2>When something goes wrong</h2>
  <ul>
  <li><b>Repo not cloned:</b> open the code in GitLab's web view and check there.</li>
  <li><b>No laptop or an empty battery:</b> the same, on your laptop.</li>
  <li><b>Little project code so far:</b> that's normal, it's a work-in-progress check. Check the newest code they wrote, even if it doesn't work yet.</li>
  <li><b>No code to look at, or the slot was cut short:</b> Outcome <b>Needs Maro</b>, and say what happened under “What I saw”.</li>
  </ul>

  <h2>Change moves</h2>
  <table><thead><tr><th>Move</th><th>Ask</th></tr></thead><tbody>
  <tr><td>Tweak</td><td>Change a number or flip a comparison. What happens?</td></tr>
  <tr><td>Remove</td><td>Comment this out. What breaks, and when do we notice?</td></tr>
  <tr><td>Move it</td><td>Move this from <code>Start</code> to <code>Update</code>, or the other way.</td></tr>
  <tr><td>Extend</td><td>Add one small thing, two or three lines.</td></tr>
  <tr><td>Trace</td><td>What calls this? What happens just before?</td></tr>
  <tr><td>Why not</td><td>Why this and not X? Only after a change, never as the opener.</td></tr>
  </tbody></table>

  <h2>In the room</h2>
  <ul>
  <li>Write notes during the slot; there is no separate note time.</li>
  <li>Check 1 and check 2 are on two different foundation assignments (Mentorship Path: two parts of the tutorial package). The Final Project is not checked: the check-in is support only.</li>
  <li>Masters on the Mentorship Path: check 1 on the tutorial package.</li>
  <li>A third check takes time from the check-in.</li>
  <li>Know them personally? Ask another TA to take over.</li>
  </ul>
  </div>`;
}

/* ---------- main render ---------- */
function render(){
  live.save();
  renderChrome();
  const m = document.getElementById("main");
  m.innerHTML = S.tab==="flow" ? renderFlow() : S.tab==="guide" ? renderGuide() : renderDeck(S.tab);
  renderClock();
}

/* ---------- actions ---------- */
function copyOut(text){
  const done = ok => { const b = document.querySelector(`[data-copying]`); if(b){ b.textContent = ok?"Copied. Now paste it in Notion":"Select and copy the text"; b.removeAttribute("data-copying"); setTimeout(render, 2200);} };
  const fallback = () => {
    const ta = document.createElement("textarea"); ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select(); let ok=false; try{ ok = document.execCommand("copy"); }catch(e){}
    ta.remove(); done(ok);
  };
  if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(text).then(()=>done(true), fallback); }
  else fallback();
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act, v = b.dataset.v, i = b.dataset.p !== undefined ? Number(b.dataset.p) : null;
  if(a !== "next" && S.armedNext){ S.armedNext = false; }
  if(!["next","tab","copynotes","timer","nextphase","phase","reveal"].includes(a)) S.copied = false;
  switch(a){
    case "mode": S.mode = v; S.modeChosen = true; store.set("crg-mode", v); S.advice = null;
      // reset check decks that no longer fit
      S.probes.forEach(p => { if(p.card && !cardsFor(p.deck).some(c=>c.id===p.card)) Object.assign(p, blankProbe()); });
      break;
    case "tab": S.tab = v; window.scrollTo(0,0); break;
    case "nextphase": { if(!S.timer.running){ S.timer.start = Date.now(); S.timer.running = true; }
      const ph = phasesFor(S.mode), i = ph.findIndex(p => p.id === S.phase);
      S.phase = ph[Math.min(i+1, ph.length-1)].id; S.phaseAt = elapsed(); break; }
    case "phase": if(!S.timer.running && elapsed()===0){ S.timer.start = Date.now(); S.timer.running = true; }
      S.phase = v; S.phaseAt = elapsed(); S.tab = "flow"; scrollTarget = v; break;
    case "timer":
      if(S.timer.running){ S.timer.acc += Date.now()-S.timer.start; S.timer.running = false; }
      else { S.timer.start = Date.now(); S.timer.running = true; }
      break;
    case "next":
      if(!S.copied && !S.armedNext && hasData()){ S.armedNext = true; renderChrome(); return; }
      reset(true); live.clear(); break;
    case "suggest": { const k = suggestA(); S.sugg = k; const p = S.probes[i ?? 0]; p.deck = k; p.card = deal(k).id; p.reveal = false; break; }
    case "pick": { const p = S.probes[i]; p.deck = v;
      const used = S.probes.filter((q,j)=>j!==i && q.deck===v).map(q=>q.card);
      p.card = deal(v, used[0]).id; p.reveal = false; break; }
    case "redeal": { const p = S.probes[i]; p.card = deal(p.deck, p.card).id; p.reveal = false; break; }
    case "use": { const f = findCard(v), p = S.probes[i]; p.deck = f.deck; p.card = v; p.reveal = false; S.tab = "flow"; break; }
    case "reveal": S.probes[i].reveal = !S.probes[i].reveal; break;
    case "res": { const p = S.probes[i]; p.result = p.result===v ? null : v; if(p.result!=="unclear") p.fails = []; break; }
    case "fail": { const p = S.probes[i]; p.fails = p.fails.includes(v) ? p.fails.filter(x=>x!==v) : p.fails.concat(v); break; }
    case "ai": { const p = S.probes[i]; p.ai = p.ai===v ? null : v; break; }
    case "aipath": S.aiPath = S.aiPath===v ? null : v; break;
    case "advice": S.advice = S.advice===v ? null : v; break;
    case "copynotes": S.copied = true; live.save(); b.setAttribute("data-copying",""); copyOut(notesText()); return;
    case "outcome": S.outcome = finalOutcome()===v && S.outcome ? null : v; break;
  }
  render();
  if(scrollTarget){ scrollToPhase(scrollTarget); scrollTarget = null; }
});
document.addEventListener("input", e => {
  const t = e.target, k = t.dataset.in; if(!k) return;
  if(k === "script") S.probes[Number(t.dataset.p)].script = t.value;
  else if(k === "unprepared") S.unprepared = t.checked;
  else if(["saw","ci1","ci2"].includes(k)) S[k] = t.value;
  else return;
  S.copied = false;
  live.save();
  const o = document.getElementById("notes");
  if(o) o.textContent = notesText();
});
setInterval(() => { if(S.timer.running) renderClock(); }, 500);
render();
})();
</script>
